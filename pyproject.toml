[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mondonorm"
version = "1.0.0"
description = "Interactively validate and normalise GA4GH phenopacket disease terms against the MONDO ontology"
requires-python = ">=3.9"
dependencies = []  # stdlib-only by default

[project.optional-dependencies]
recommended = ["rapidfuzz>=3.0", "rich>=13.0"]

[project.scripts]
mondonorm = "mondonorm.cli:main"

[tool.setuptools]
packages = ["mondonorm"]

[tool.setuptools.package-data]
mondonorm = ["data/*.obo"]
